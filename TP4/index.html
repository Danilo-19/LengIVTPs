<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light py-5">
    <div class="container text-center py-5">
        <h1 class="fw-bold mb-4">Blobs</h1>
        
        <div class="d-flex justify-content-center gap-3 flex-wrap my-4">
            <button id="btnCrear" class="btn btn-success btn-lg px-4 fw-semibold">Crear Blob de texto</button>
            <button id="btnDescargar" class="btn btn-success btn-lg px-4 fw-semibold" disabled>Descargar Blob</button>
            <button id="btnSlice" class="btn btn-success btn-lg px-4 fw-semibold" disabled>Usar slice()</button>
        </div>

        <div id="resultado" class="alert alert-info mt-4 d-none mx-auto" style="max-width: 600px;">
            <p id="resultadoTexto" class="mb-0 fw-medium"></p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
