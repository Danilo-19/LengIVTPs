<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 650px;">
        
        <div class="card shadow-sm border-0 rounded-3 mb-4 p-4 bg-white">
            <p class="fs-5 fw-semibold mb-3">Seleccionar Imagen:</p>
            <div>
                <input type="file" id="fileInput" accept="image/*" class="d-none">
                <button id="btnSubir" class="btn btn-primary px-4 py-2 fw-semibold">Subir Archivo</button>
            </div>
        </div>

        <div id="infoCard" class="card shadow-sm border-0 rounded-3 p-4 bg-white d-none">
            <div id="fileDetails" class="mb-3">
                <p class="mb-1 fw-bold text-dark fs-5">Nombre: <span id="fileName" class="fw-normal"></span></p>
                <p class="mb-1 fw-bold text-dark fs-5">Tipo: <span id="fileType" class="fw-normal"></span></p>
                <p class="mb-0 fw-bold text-dark fs-5">Tamaño: <span id="fileSize" class="fw-normal"></span> bytes</p>
            </div>
            <div class="border rounded p-2 d-inline-block bg-white shadow-sm" style="max-width: 300px;">
                <img id="imgPreview" src="" alt="Vista previa" class="img-fluid rounded">
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
