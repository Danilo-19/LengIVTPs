<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ubicación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="form-card shadow-sm rounded-4 bg-white p-5 mt-5">
            <h1 class="form-title text-center mb-4">Ubicación</h1>

            <!-- Mensaje de resultado general -->
            <div id="formResult" class="alert d-none" role="alert"></div>

            <!-- Agrego mensaje informativo de campos obligatorios -->
            <div id="messInfo">
                <small class="form-text text-muted">Campos obligatorios*</small>
            </div>

            <!-- Formulario de registro -->
            <form id="ubicacion" novalidate>
                <!-- Nombre Ubicación -->
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre Ubicación *</label>
                    <input type="text" class="form-control" id="nombre">
                    <div class="invalid-feedback"></div>
                </div>

                <!-- Latitud -->
                <div class="mb-3">
                    <label for="latitud" class="form-label">Latitud *</label>
                    <input type="text" class="form-control" id="latitud">
                    <div class="invalid-feedback"></div>
                </div>

                <!-- Longitud -->
                <div class="mb-3">
                    <label for="longitud" class="form-label">Longitud *</label>
                    <input type="text" class="form-control" id="longitud">
                    <div class="invalid-feedback"></div>
                </div>

                <!-- Botón Abrir Ubicación-->
                <button type="submit" class="btn btn-primary w-100 btn-lg mt-4">Abrir Ubicación</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
